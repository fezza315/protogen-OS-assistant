[package]
name = "protogen-ui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "protogen-ui"
path = "src/main.rs"

[dependencies]
protogen-plan = { path = "../plan-types" }
gtk = { package = "gtk4", version = "0.9", features = ["v4_10"] }
glib = "0.20"
async-channel = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
