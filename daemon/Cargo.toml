[package]
name = "protogen-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "protogen-daemon"
path = "src/main.rs"

[dependencies]
protogen-plan = { path = "../plan-types" }
protogen-launcher = { path = "../launcher-scan" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
thiserror = "1"
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
protogen-cmdrunner = { path = "../cmdrunner" }
